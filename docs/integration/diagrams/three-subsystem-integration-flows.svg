<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#16a34a"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7c3aed"/></marker>
    <style>
      .title { font: 700 46px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #0b2f6b; }
      .subtitle { font: 400 24px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #334155; }
      .section { font: 700 31px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #0f172a; }
      .node { font: 700 22px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #1e293b; }
      .small { font: 400 18px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #475569; }
      .foot { font: 600 21px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #334155; }
      .white { fill: white; }
    </style>
  </defs>
  <rect width="1600" height="900" fill="#f8fbff"/>
  <text x="70" y="82" class="title">与各子系统的集成流程</text>
  <text x="72" y="126" class="subtitle">围绕 App 入口、知识图谱数据与后台质量管理，形成三条对接链路</text>

  <rect x="55" y="170" width="1490" height="185" rx="24" fill="#f0fdf4" stroke="#22c55e" stroke-width="2" filter="url(#shadow)"/>
  <text x="100" y="224" class="section" fill="#166534">1. 与 App 子系统集成流程</text>
  <g transform="translate(255 260)">
    <rect width="170" height="62" rx="14" fill="white" stroke="#86efac"/><text x="85" y="39" text-anchor="middle" class="node">文物详情页</text>
  </g>
  <g transform="translate(490 260)">
    <rect width="170" height="62" rx="14" fill="white" stroke="#86efac"/><text x="85" y="39" text-anchor="middle" class="node">获取 objectId</text>
  </g>
  <g transform="translate(725 260)">
    <rect width="190" height="62" rx="14" fill="white" stroke="#86efac"/><text x="95" y="29" text-anchor="middle" class="node">输入 question</text><text x="95" y="52" text-anchor="middle" class="small">文本 / 语音识别</text>
  </g>
  <g transform="translate(980 260)">
    <rect width="190" height="62" rx="14" fill="white" stroke="#86efac"/><text x="95" y="39" text-anchor="middle" class="node">POST /api/qa/ask</text>
  </g>
  <g transform="translate(1235 260)">
    <rect width="225" height="62" rx="14" fill="white" stroke="#86efac"/><text x="112" y="29" text-anchor="middle" class="node">展示 answer / sources</text><text x="112" y="52" text-anchor="middle" class="small">再提交 feedback</text>
  </g>
  <path d="M425 291 L482 291" stroke="#16a34a" stroke-width="5" marker-end="url(#arrow-green)"/>
  <path d="M660 291 L717 291" stroke="#16a34a" stroke-width="5" marker-end="url(#arrow-green)"/>
  <path d="M915 291 L972 291" stroke="#16a34a" stroke-width="5" marker-end="url(#arrow-green)"/>
  <path d="M1170 291 L1227 291" stroke="#16a34a" stroke-width="5" marker-end="url(#arrow-green)"/>
  <text x="1020" y="340" class="small" fill="#166534">接口：POST /api/qa/ask，POST /api/qa/feedback</text>

  <rect x="55" y="385" width="1490" height="185" rx="24" fill="#eff6ff" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
  <text x="100" y="439" class="section" fill="#1d4ed8">2. 与知识图谱子系统集成流程</text>
  <g transform="translate(250 475)">
    <rect width="185" height="62" rx="14" fill="white" stroke="#93c5fd"/><text x="92" y="39" text-anchor="middle" class="node">图谱构建</text>
  </g>
  <g transform="translate(500 475)">
    <rect width="185" height="62" rx="14" fill="white" stroke="#93c5fd"/><text x="92" y="39" text-anchor="middle" class="node">Neo4j 存储</text>
  </g>
  <g transform="translate(750 475)">
    <rect width="215" height="62" rx="14" fill="white" stroke="#93c5fd"/><text x="107" y="29" text-anchor="middle" class="node">objectId + intent</text><text x="107" y="52" text-anchor="middle" class="small">定位查询入口</text>
  </g>
  <g transform="translate(1030 475)">
    <rect width="185" height="62" rx="14" fill="white" stroke="#93c5fd"/><text x="92" y="39" text-anchor="middle" class="node">Cypher 查询</text>
  </g>
  <g transform="translate(1280 475)">
    <rect width="205" height="62" rx="14" fill="white" stroke="#93c5fd"/><text x="102" y="29" text-anchor="middle" class="node">返回事实与来源</text><text x="102" y="52" text-anchor="middle" class="small">factContent / sources</text>
  </g>
  <path d="M435 506 L492 506" stroke="#2563eb" stroke-width="5" marker-end="url(#arrow-blue)"/>
  <path d="M685 506 L742 506" stroke="#2563eb" stroke-width="5" marker-end="url(#arrow-blue)"/>
  <path d="M965 506 L1022 506" stroke="#2563eb" stroke-width="5" marker-end="url(#arrow-blue)"/>
  <path d="M1215 506 L1272 506" stroke="#2563eb" stroke-width="5" marker-end="url(#arrow-blue)"/>
  <text x="655" y="555" class="small" fill="#1d4ed8">统一标识：Artifact.object_id = artifacts.object_id；查询方式：Neo4j Driver / Cypher</text>

  <rect x="55" y="600" width="1490" height="185" rx="24" fill="#faf5ff" stroke="#8b5cf6" stroke-width="2" filter="url(#shadow)"/>
  <text x="100" y="654" class="section" fill="#6d28d9">3. 与后台管理子系统集成流程</text>
  <g transform="translate(250 690)">
    <rect width="185" height="62" rx="14" fill="white" stroke="#c4b5fd"/><text x="92" y="39" text-anchor="middle" class="node">记录 qa_log</text>
  </g>
  <g transform="translate(500 690)">
    <rect width="185" height="62" rx="14" fill="white" stroke="#c4b5fd"/><text x="92" y="39" text-anchor="middle" class="node">写入反馈</text>
  </g>
  <g transform="translate(750 690)">
    <rect width="215" height="62" rx="14" fill="white" stroke="#c4b5fd"/><text x="107" y="39" text-anchor="middle" class="node">生成审核任务</text>
  </g>
  <g transform="translate(1030 690)">
    <rect width="185" height="62" rx="14" fill="white" stroke="#c4b5fd"/><text x="92" y="39" text-anchor="middle" class="node">/api/admin/qa/*</text>
  </g>
  <g transform="translate(1280 690)">
    <rect width="205" height="62" rx="14" fill="white" stroke="#c4b5fd"/><text x="102" y="29" text-anchor="middle" class="node">审核与统计优化</text><text x="102" y="52" text-anchor="middle" class="small">质量闭环</text>
  </g>
  <path d="M435 721 L492 721" stroke="#7c3aed" stroke-width="5" marker-end="url(#arrow-purple)"/>
  <path d="M685 721 L742 721" stroke="#7c3aed" stroke-width="5" marker-end="url(#arrow-purple)"/>
  <path d="M965 721 L1022 721" stroke="#7c3aed" stroke-width="5" marker-end="url(#arrow-purple)"/>
  <path d="M1215 721 L1272 721" stroke="#7c3aed" stroke-width="5" marker-end="url(#arrow-purple)"/>
  <text x="580" y="803" class="foot">日志、反馈、失败问题、审核任务和统计结果统一进入后台管理。</text>
</svg>
