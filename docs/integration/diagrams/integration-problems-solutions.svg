<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/>
    </marker>
    <style>
      .title { font: 700 46px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #0b2f6b; }
      .subtitle { font: 400 24px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #334155; }
      .problem { font: 700 27px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #0f172a; }
      .solution { font: 700 27px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #0b2f6b; }
      .text { font: 400 21px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #334155; }
      .foot { font: 700 27px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #0b2f6b; }
    </style>
  </defs>
  <rect width="1600" height="900" fill="#f8fbff"/>
  <text x="70" y="82" class="title">集成问题与解决思路</text>
  <text x="72" y="126" class="subtitle">围绕标识统一、数据协同、接口规范和质量闭环，解决跨子系统联调中的关键问题</text>

  <g transform="translate(70 175)">
    <rect width="620" height="130" rx="20" fill="#f0fdf4" stroke="#22c55e" stroke-width="2" filter="url(#shadow)"/>
    <circle cx="62" cy="65" r="36" fill="#22c55e"/>
    <text x="117" y="54" class="problem">问题 1：跨子系统文物标识不一致</text>
    <text x="117" y="90" class="text">App、MySQL、Neo4j、问答日志若标识不统一，</text>
    <text x="117" y="118" class="text">会导致对象无法准确关联，影响联调和追踪。</text>
  </g>
  <path d="M720 240 L855 240" stroke="#2563eb" stroke-width="7" marker-end="url(#arrow)"/>
  <g transform="translate(890 175)">
    <rect width="640" height="130" rx="20" fill="#ffffff" stroke="#93c5fd" stroke-width="2" filter="url(#shadow)"/>
    <circle cx="62" cy="65" r="36" fill="#2563eb"/>
    <text x="117" y="54" class="solution">解决：统一使用 objectId</text>
    <text x="117" y="90" class="text">贯穿 App 请求、MySQL 存储、Neo4j 节点、</text>
    <text x="117" y="118" class="text">qa_log 记录和反馈审核，保证同一文物可定位。</text>
  </g>

  <g transform="translate(70 335)">
    <rect width="620" height="130" rx="20" fill="#eff6ff" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
    <circle cx="62" cy="65" r="36" fill="#2563eb"/>
    <text x="117" y="54" class="problem">问题 2：数据源侧重点不同</text>
    <text x="117" y="90" class="text">MySQL 更适合文物基础属性，Neo4j 更适合</text>
    <text x="117" y="118" class="text">实体关系、推荐、统计与多跳查询。</text>
  </g>
  <path d="M720 400 L855 400" stroke="#2563eb" stroke-width="7" marker-end="url(#arrow)"/>
  <g transform="translate(890 335)">
    <rect width="640" height="130" rx="20" fill="#ffffff" stroke="#93c5fd" stroke-width="2" filter="url(#shadow)"/>
    <circle cx="62" cy="65" r="36" fill="#2563eb"/>
    <text x="117" y="54" class="solution">解决：双数据源协同检索</text>
    <text x="117" y="90" class="text">MySQL 负责材质、尺寸、介绍、详情链接兜底；</text>
    <text x="117" y="118" class="text">Neo4j 负责关系、推荐、统计和复杂问答。</text>
  </g>

  <g transform="translate(70 495)">
    <rect width="620" height="130" rx="20" fill="#faf5ff" stroke="#8b5cf6" stroke-width="2" filter="url(#shadow)"/>
    <circle cx="62" cy="65" r="36" fill="#8b5cf6"/>
    <text x="117" y="54" class="problem">问题 3：接口字段与协议需要统一</text>
    <text x="117" y="90" class="text">若字段含义、命名方式或返回结构不一致，</text>
    <text x="117" y="118" class="text">容易导致 App 对接失败、后台查询不稳定。</text>
  </g>
  <path d="M720 560 L855 560" stroke="#2563eb" stroke-width="7" marker-end="url(#arrow)"/>
  <g transform="translate(890 495)">
    <rect width="640" height="130" rx="20" fill="#ffffff" stroke="#c4b5fd" stroke-width="2" filter="url(#shadow)"/>
    <circle cx="62" cy="65" r="36" fill="#8b5cf6"/>
    <text x="117" y="54" class="solution">解决：统一 JSON 交互规范</text>
    <text x="117" y="90" class="text">明确 question、objectId、sessionId、feedbackType，</text>
    <text x="117" y="118" class="text">统一 ask、feedback、admin/qa 三类接口。</text>
  </g>

  <g transform="translate(70 655)">
    <rect width="620" height="130" rx="20" fill="#fff7ed" stroke="#f97316" stroke-width="2" filter="url(#shadow)"/>
    <circle cx="62" cy="65" r="36" fill="#f97316"/>
    <text x="117" y="54" class="problem">问题 4：问答质量需要持续优化</text>
    <text x="117" y="90" class="text">仅完成答案返回还不够，需要追踪不准确、</text>
    <text x="117" y="118" class="text">失败问题和高频问题，支撑后续数据补充。</text>
  </g>
  <path d="M720 720 L855 720" stroke="#2563eb" stroke-width="7" marker-end="url(#arrow)"/>
  <g transform="translate(890 655)">
    <rect width="640" height="130" rx="20" fill="#ffffff" stroke="#fdba74" stroke-width="2" filter="url(#shadow)"/>
    <circle cx="62" cy="65" r="36" fill="#f97316"/>
    <text x="117" y="54" class="solution">解决：反馈 - 审核 - 统计闭环</text>
    <text x="117" y="90" class="text">记录 qa_feedback、qa_failed_question、qa_review_task，</text>
    <text x="117" y="118" class="text">后台查看日志、审核任务和统计结果。</text>
  </g>

  <rect x="90" y="820" width="1420" height="58" rx="16" fill="#e0f2fe" stroke="#7dd3fc"/>
  <text x="180" y="857" class="foot">通过统一标识、双数据源协同、接口规范与反馈闭环，保障知识问答服务稳定可集成。</text>
</svg>
