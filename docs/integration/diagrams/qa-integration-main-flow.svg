<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <style>
      .title { font: 700 46px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #0b2f6b; }
      .subtitle { font: 400 24px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #334155; }
      .num { font: 700 24px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: white; }
      .node { font: 700 25px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #172554; }
      .small { font: 400 19px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #475569; }
    </style>
  </defs>
  <rect width="1600" height="900" fill="#f8fbff"/>
  <path d="M0 820 C320 760 620 880 930 825 C1210 775 1370 760 1600 810 L1600 900 L0 900 Z" fill="#dbeafe"/>
  <path d="M0 860 C370 805 650 920 1000 855 C1250 812 1420 805 1600 830 L1600 900 L0 900 Z" fill="#2563eb" opacity="0.92"/>
  <text x="70" y="82" class="title">知识问答子系统集成流程</text>
  <text x="72" y="126" class="subtitle">从 App 提问，到知识检索、答案返回、反馈审核，形成完整业务闭环</text>

  <g id="row1">
    <g transform="translate(55 220)">
      <rect width="210" height="150" rx="20" fill="white" stroke="#bfdbfe" filter="url(#shadow)"/>
      <circle cx="34" cy="34" r="24" fill="#2563eb"/><text x="27" y="43" class="num">1</text>
      <text x="42" y="88" text-anchor="middle" class="small">用户在 App</text>
      <text x="105" y="116" text-anchor="middle" class="node">进入智能问答</text>
    </g>
    <g transform="translate(305 220)">
      <rect width="210" height="150" rx="20" fill="white" stroke="#bfdbfe" filter="url(#shadow)"/>
      <circle cx="34" cy="34" r="24" fill="#2563eb"/><text x="27" y="43" class="num">2</text>
      <text x="105" y="84" text-anchor="middle" class="node">获取 objectId</text>
      <text x="105" y="118" text-anchor="middle" class="small">输入 question</text>
    </g>
    <g transform="translate(555 220)">
      <rect width="210" height="150" rx="20" fill="white" stroke="#bfdbfe" filter="url(#shadow)"/>
      <circle cx="34" cy="34" r="24" fill="#2563eb"/><text x="27" y="43" class="num">3</text>
      <text x="105" y="84" text-anchor="middle" class="node">调用问答接口</text>
      <text x="105" y="118" text-anchor="middle" class="small">POST /api/qa/ask</text>
    </g>
    <g transform="translate(805 220)">
      <rect width="210" height="150" rx="20" fill="white" stroke="#bfdbfe" filter="url(#shadow)"/>
      <circle cx="34" cy="34" r="24" fill="#2563eb"/><text x="27" y="43" class="num">4</text>
      <text x="105" y="84" text-anchor="middle" class="node">意图识别</text>
      <text x="105" y="118" text-anchor="middle" class="small">判断问题类型</text>
    </g>
    <g transform="translate(1055 220)">
      <rect width="210" height="150" rx="20" fill="white" stroke="#bfdbfe" filter="url(#shadow)"/>
      <circle cx="34" cy="34" r="24" fill="#2563eb"/><text x="27" y="43" class="num">5</text>
      <text x="105" y="82" text-anchor="middle" class="node">解析文物对象</text>
      <text x="105" y="116" text-anchor="middle" class="small">objectId / 文物名</text>
    </g>
    <g transform="translate(1305 220)">
      <rect width="230" height="150" rx="20" fill="white" stroke="#bfdbfe" filter="url(#shadow)"/>
      <circle cx="34" cy="34" r="24" fill="#2563eb"/><text x="27" y="43" class="num">6</text>
      <text x="115" y="84" text-anchor="middle" class="node">知识检索</text>
      <text x="115" y="118" text-anchor="middle" class="small">MySQL / Neo4j</text>
    </g>
  </g>

  <path d="M266 295 L298 295" stroke="#2563eb" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M516 295 L548 295" stroke="#2563eb" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M766 295 L798 295" stroke="#2563eb" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M1016 295 L1048 295" stroke="#2563eb" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M1266 295 L1298 295" stroke="#2563eb" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M1420 375 C1420 420 1390 430 1320 430 L300 430 C215 430 190 455 190 500" fill="none" stroke="#2563eb" stroke-width="5" marker-end="url(#arrow)"/>

  <g id="row2">
    <g transform="translate(55 515)">
      <rect width="210" height="150" rx="20" fill="white" stroke="#bfdbfe" filter="url(#shadow)"/>
      <circle cx="34" cy="34" r="24" fill="#2563eb"/><text x="27" y="43" class="num">7</text>
      <text x="105" y="82" text-anchor="middle" class="node">生成答案</text>
      <text x="105" y="112" text-anchor="middle" class="small">answer / sources</text>
      <text x="105" y="139" text-anchor="middle" class="small">relatedArtifacts</text>
    </g>
    <g transform="translate(305 515)">
      <rect width="210" height="150" rx="20" fill="white" stroke="#bfdbfe" filter="url(#shadow)"/>
      <circle cx="34" cy="34" r="24" fill="#2563eb"/><text x="27" y="43" class="num">8</text>
      <text x="105" y="80" text-anchor="middle" class="node">写入日志</text>
      <text x="105" y="111" text-anchor="middle" class="small">qa_log</text>
      <text x="105" y="138" text-anchor="middle" class="small">qa_source_record</text>
    </g>
    <g transform="translate(555 515)">
      <rect width="210" height="150" rx="20" fill="white" stroke="#bfdbfe" filter="url(#shadow)"/>
      <circle cx="34" cy="34" r="24" fill="#2563eb"/><text x="27" y="43" class="num">9</text>
      <text x="105" y="82" text-anchor="middle" class="node">App 展示</text>
      <text x="105" y="112" text-anchor="middle" class="small">答案、来源、推荐</text>
      <text x="105" y="139" text-anchor="middle" class="small">反馈按钮</text>
    </g>
    <g transform="translate(805 515)">
      <rect width="210" height="150" rx="20" fill="white" stroke="#bfdbfe" filter="url(#shadow)"/>
      <circle cx="34" cy="34" r="24" fill="#2563eb"/><text x="20" y="43" class="num">10</text>
      <text x="105" y="82" text-anchor="middle" class="node">提交反馈</text>
      <text x="105" y="118" text-anchor="middle" class="small">/api/qa/feedback</text>
    </g>
    <g transform="translate(1055 515)">
      <rect width="210" height="150" rx="20" fill="white" stroke="#bfdbfe" filter="url(#shadow)"/>
      <circle cx="34" cy="34" r="24" fill="#2563eb"/><text x="20" y="43" class="num">11</text>
      <text x="105" y="82" text-anchor="middle" class="node">生成审核任务</text>
      <text x="105" y="118" text-anchor="middle" class="small">qa_review_task</text>
    </g>
    <g transform="translate(1305 515)">
      <rect width="230" height="150" rx="20" fill="white" stroke="#bfdbfe" filter="url(#shadow)"/>
      <circle cx="34" cy="34" r="24" fill="#2563eb"/><text x="20" y="43" class="num">12</text>
      <text x="115" y="82" text-anchor="middle" class="node">后台管理</text>
      <text x="115" y="118" text-anchor="middle" class="small">查看与处理数据</text>
    </g>
  </g>

  <path d="M266 590 L298 590" stroke="#2563eb" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M516 590 L548 590" stroke="#2563eb" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M766 590 L798 590" stroke="#2563eb" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M1016 590 L1048 590" stroke="#2563eb" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M1266 590 L1298 590" stroke="#2563eb" stroke-width="5" marker-end="url(#arrow)"/>

  <rect x="70" y="735" width="1460" height="78" rx="18" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="110" y="785" class="node">闭环结果：</text>
  <text x="245" y="785" class="small">用户提问 - 知识检索 - 可信回答 - 用户反馈 - 后台审核统计，支撑问答质量持续优化。</text>
</svg>
