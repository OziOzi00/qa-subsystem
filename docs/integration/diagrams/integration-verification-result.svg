<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <style>
      .title { font: 700 46px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #0b2f6b; }
      .subtitle { font: 400 24px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #334155; }
      .cardtitle { font: 700 30px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #102a5c; }
      .text { font: 400 22px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #334155; }
      .code { font: 600 20px "Consolas", "Microsoft YaHei", monospace; fill: #0f172a; }
      .ok { font: 700 23px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #166534; }
      .foot { font: 700 29px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #0b2f6b; }
    </style>
  </defs>
  <rect width="1600" height="900" fill="#f8fbff"/>
  <path d="M0 812 C300 770 620 870 920 820 C1200 775 1380 760 1600 805 L1600 900 L0 900 Z" fill="#dbeafe"/>
  <path d="M0 855 C360 800 660 915 1000 855 C1250 812 1420 805 1600 830 L1600 900 L0 900 Z" fill="#2563eb" opacity="0.92"/>
  <text x="70" y="82" class="title">集成验证结果</text>
  <text x="72" y="126" class="subtitle">从接口可调用、图谱可查询、后台可管理三个方面验证集成成果</text>

  <rect x="80" y="190" width="450" height="455" rx="26" fill="#f0fdf4" stroke="#22c55e" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="305" cy="260" r="48" fill="#22c55e"/>
  <text x="278" y="273" class="ok" fill="white">App</text>
  <text x="170" y="350" class="cardtitle">App 对接验证</text>
  <text x="125" y="410" class="code">POST /api/qa/ask</text>
  <text x="125" y="448" class="text">接收 question、objectId、sessionId</text>
  <text x="125" y="492" class="code">POST /api/qa/feedback</text>
  <text x="125" y="530" class="text">记录有帮助 / 不准确反馈</text>
  <text x="125" y="590" class="ok">结果：支持 App 作为用户侧入口</text>

  <rect x="575" y="190" width="450" height="455" rx="26" fill="#eff6ff" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="800" cy="260" r="48" fill="#2563eb"/>
  <text x="770" y="273" class="ok" fill="white">KG</text>
  <text x="690" y="350" class="cardtitle">知识图谱验证</text>
  <text x="620" y="410" class="text">Neo4j 查询已支撑：</text>
  <text x="620" y="454" class="text">收藏地、年代、作者、同作者作品</text>
  <text x="620" y="498" class="text">同朝代文物、相关文物推荐</text>
  <text x="620" y="542" class="text">统计类与基础多跳问答</text>
  <text x="620" y="590" class="ok">结果：图谱事实进入 factContent / sources</text>

  <rect x="1070" y="190" width="450" height="455" rx="26" fill="#faf5ff" stroke="#8b5cf6" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="1295" cy="260" r="48" fill="#8b5cf6"/>
  <text x="1260" y="273" class="ok" fill="white">Admin</text>
  <text x="1185" y="350" class="cardtitle">后台管理验证</text>
  <text x="1115" y="410" class="code">GET /api/admin/qa/logs</text>
  <text x="1115" y="450" class="code">GET /api/admin/qa/feedback</text>
  <text x="1115" y="490" class="code">GET /api/admin/qa/review-tasks</text>
  <text x="1115" y="530" class="code">GET /api/admin/qa/statistics/*</text>
  <text x="1115" y="590" class="ok">结果：支持日志、反馈、审核和统计展示</text>

  <rect x="140" y="700" width="1320" height="92" rx="20" fill="white" stroke="#bfdbfe"/>
  <text x="208" y="756" class="foot">当前已形成“用户提问 - 知识检索 - 答案返回 - 反馈审核 - 后台统计”的集成闭环。</text>
</svg>
